# Carries abap2UI5's changes to the two mirrors this template holds, as ONE
# pull request, instead of reporting that they drifted and waiting for a
# maintainer to regenerate by hand:
#
#   AGENTS.md, from "1. The model in one paragraph" down
#       generated by scripts/generate-agents.mjs from abap2UI5's
#       docs/agents/building-apps.md
#   .claude/skills/{build-an-app,view-chain-layout,abap-check,ui5-check}/SKILL.md
#       generated by scripts/generate-skills.mjs from abap2UI5's own
#       .claude/skills/
#
# The drift is created by a commit over THERE, so nothing in this repository
# triggers on it. template-self-check.yml used to run daily to notice it, and
# filed an issue - for the AGENTS.md half only - that a maintainer then had to
# answer by running the generator and committing what it wrote. That happened
# twice in one day (#41 for the skills, #45 for abap-check again). There is no
# judgement in that step: the generators are the whole procedure. So this
# workflow runs it.
#
# How:
#   1. abap2UI5 main is cloned (shallow, sparse: docs/agents and
#      .claude/skills) NEXT TO this checkout. Both generators read that
#      sibling first, so they read one commit - the one the PR body names -
#      instead of two raw fetches of a moving `main`.
#   2. Both generators run in write mode.
#   3. If anything under AGENTS.md or .claude/skills/ changed, the template's
#      own gates run over the result (the ones template-self-check.yml runs).
#   4. peter-evans/create-pull-request opens or updates the PR on the stable
#      branch `bot/sync-mirrors` - one PR, rewritten by each run, never
#      auto-merged. When the mirrors already match (somebody regenerated by
#      hand, or the upstream change was reverted) the same step closes a PR
#      that is no longer needed and deletes its branch.
#
# A PR opened with GITHUB_TOKEN does not trigger check.yml or
# template-self-check.yml - GitHub does not start workflows from events that
# token causes. bump-linter.yaml has the same property and the same answer,
# which is used here: the gates run in THIS job before the PR is opened, and
# the body says so. Closing and reopening the PR by hand starts the regular
# checks, if a reviewer wants them on the PR itself.
#
# What cannot be carried automatically is filed as ONE issue (opened or
# reopened, then commented on by each red run, closed by the next green one):
# a declared deviation whose upstream sentence was edited away (both
# generators then refuse to write, by design - the reword has to be decided by
# a person), a skill the framework no longer has, regenerated text the
# template's gates reject, or a PR the token was not allowed to open. That is
# the only issue channel for the mirrors; template-self-check.yml no longer
# runs on a schedule or files one.
#
# An unreachable github.com is a notice and a green run, as in the generators
# themselves - and in that case the PR step is skipped, because with nothing
# regenerated it would read "no diff" and close a PR that is still needed.
name: sync-mirrors

on:
  schedule:
    - cron: '37 4 * * *'   # daily, 04:37 UTC
  workflow_dispatch:

# Two runs must not race on the one branch; a queued run waits instead of
# cancelling one that is halfway through pushing.
concurrency:
  group: sync-mirrors
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents + pull-requests: push bot/sync-mirrors and open the PR.
    # issues: the one tracked channel for what a person has to decide.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    # The sibling path is the one both generators look at first:
    # path.join(ROOT, '..', 'abap2UI5'). Outside the workspace, so it can
    # never end up in the PR.
    - name: Clone abap2UI5 main next to this checkout
      id: upstream
      run: |
        set -uo pipefail
        UPSTREAM="$GITHUB_WORKSPACE/../abap2UI5"
        if ! git clone --quiet --depth 1 --filter=blob:none --sparse --no-tags \
               https://github.com/abap2UI5/abap2UI5.git "$UPSTREAM" \
           || ! git -C "$UPSTREAM" sparse-checkout set docs/agents .claude/skills; then
          echo "::notice::abap2UI5 is not reachable - nothing was regenerated, nothing was verified"
          echo "reachable=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        {
          echo "reachable=true"
          echo "sha=$(git -C "$UPSTREAM" rev-parse HEAD)"
          echo "short=$(git -C "$UPSTREAM" rev-parse --short=10 HEAD)"
        } >> "$GITHUB_OUTPUT"

    # Both generators, both in write mode, transcripts to RUNNER_TEMP (never
    # into the working tree - check-template.mjs would rightly call a report
    # next to the sources an undeclared file). A SKIPPED line is a failure
    # HERE although it passes in the generators: with the sibling present,
    # it can only mean the framework no longer has a file at the path the
    # generator reads, and that is a decision, not a sync.
    - name: Regenerate the mirrors
      id: regen
      if: steps.upstream.outputs.reachable == 'true'
      env:
        SHA: ${{ steps.upstream.outputs.sha }}
        SHORT: ${{ steps.upstream.outputs.short }}
      run: |
        set -uo pipefail
        LOG="$RUNNER_TEMP/sync-mirrors.txt"
        : > "$LOG"
        status=0
        node scripts/generate-agents.mjs 2>&1 | tee -a "$LOG" || status=1
        node scripts/generate-skills.mjs 2>&1 | tee -a "$LOG" || status=1
        if grep -q 'SKIPPED' "$LOG"; then
          echo "::error::a mirror source was not found in abap2UI5@$SHORT - see the transcript"
          status=1
        fi
        [ "$status" -eq 0 ] || exit 1

        CHANGED=$(git status --porcelain -- AGENTS.md .claude/skills)
        if [ -z "$CHANGED" ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "The mirrors match abap2UI5@$SHORT - nothing to carry."
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Changed against abap2UI5@$SHORT:"
          echo "$CHANGED"
        fi

        # The PR body, written whether or not anything changed: the PR step
        # also runs on "no change", to close a PR that is no longer needed.
        {
          echo "Daily sync of the two mirrors this template holds, regenerated from"
          echo "abap2UI5 \`main\` at [\`$SHORT\`](https://github.com/abap2UI5/abap2UI5/commit/$SHA)"
          echo "by \`.github/workflows/sync-mirrors.yml\`:"
          echo
          echo "- the half of \`AGENTS.md\` from \"1. The model in one paragraph\" down"
          echo "  (\`scripts/generate-agents.mjs\`, from \`docs/agents/building-apps.md\`)"
          echo "- \`.claude/skills/*/SKILL.md\` (\`scripts/generate-skills.mjs\`, from"
          echo "  abap2UI5's \`.claude/skills/\`)"
          echo
          echo "Files changed:"
          echo
          echo '```'
          echo "$CHANGED"
          echo '```'
          echo
          echo "The template's own gates (\`check-template.mjs\`, both generators with"
          echo "\`--check\`, \`node --test scripts/test/*.test.mjs\`) ran green over this"
          echo "result in the workflow run that opened the PR:"
          echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          echo "A PR opened with \`GITHUB_TOKEN\` does not start \`check.yml\` or"
          echo "\`template-self-check.yml\` on its own - close and reopen it to run them here."
          echo
          echo "Not auto-merged. Each run rewrites this PR on \`bot/sync-mirrors\`, and"
          echo "closes it once \`main\` matches abap2UI5 without it. A wording problem"
          echo "belongs upstream: change abap2UI5 (or a declared deviation in the"
          echo "generators), not these files."
        } > "$RUNNER_TEMP/pr-body.md"

    # The gates template-self-check.yml runs, over the regenerated tree -
    # the same precondition bump-linter.yaml sets before it opens its PR.
    # The unit tests include scripts.test.mjs's claims about the skills
    # (provenance line, the deviations applied), which a regeneration can
    # break.
    - name: Template gates over the regenerated mirrors
      if: steps.regen.outputs.changed == 'true'
      run: |
        set -euo pipefail
        node scripts/check-template.mjs
        node scripts/generate-agents.mjs --check
        node scripts/generate-skills.mjs --check
        node --test scripts/test/*.test.mjs

    # Runs on "no change" too (but only when upstream was read): that is how
    # a PR made unnecessary by a hand regeneration gets closed.
    - name: Open or update the sync pull request
      if: steps.regen.outcome == 'success'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        branch: bot/sync-mirrors
        delete-branch: true
        add-paths: |
          AGENTS.md
          .claude/skills/**
        title: 'chore: sync AGENTS.md and the agent skills from abap2UI5'
        commit-message: 'chore: sync the mirrors from abap2UI5@${{ steps.upstream.outputs.short }}'
        body-path: ${{ runner.temp }}/pr-body.md

    # Best-effort, like template-self-check.yml's old channel: the job is red
    # on its own account already, and `gh` failing only warns.
    - name: File what needs a person
      if: ${{ failure() }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: 'The mirrors cannot be synced from abap2UI5 automatically'
        SHORT: ${{ steps.upstream.outputs.short }}
      run: |
        set -uo pipefail
        BODY=$(printf '%s\n' \
          "The scheduled sync of \`AGENTS.md\`'s mirrored half and \`.claude/skills/\`" \
          "from abap2UI5${SHORT:+@$SHORT} is red, so no pull request carries the change." \
          "" \
          "The usual cause is a declared deviation whose upstream sentence was edited:" \
          "the generators refuse to write then, on purpose. Reconcile the deviation" \
          "(\`SKILL_DEVIATIONS\` in \`scripts/generate-skills.mjs\`, or abap2UI5's" \
          "\`.github/shared/app-guide-deviations.mjs\` copied to" \
          "\`scripts/app-guide-deviations.mjs\`), run both generators, and commit." \
          "The next green run closes this issue." \
          "" \
          "What the run reported:" \
          "" \
          '```' \
          "$(tail -c 3000 "$RUNNER_TEMP/sync-mirrors.txt" 2>/dev/null || echo 'see the run log')" \
          '```' \
          "" \
          "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
        EXISTING=$(gh issue list --state all --search "$TITLE in:title" \
          --json number,state --jq 'first(.[]) | "\(.number) \(.state)"' 2>/dev/null) || {
          echo "::warning::could not reach the issue tracker - the run's own red is the only signal"
          exit 0
        }
        if [ -z "$EXISTING" ]; then
          gh issue create --title "$TITLE" --body "$BODY" \
            || echo "::warning::could not open the issue - the run's own red is the only signal"
        else
          NUMBER=${EXISTING%% *}
          STATE=${EXISTING##* }
          [ "$STATE" = "OPEN" ] || gh issue reopen "$NUMBER" || true
          gh issue comment "$NUMBER" --body "$BODY" \
            || echo "::warning::could not update issue #$NUMBER - the run's own red is the only signal"
        fi

    # The counterpart, only after upstream was actually read: an unreachable
    # github.com is green too, and proves nothing about the mirrors.
    - name: Close it again once the sync works
      if: ${{ success() && steps.upstream.outputs.reachable == 'true' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: 'The mirrors cannot be synced from abap2UI5 automatically'
      run: |
        set -uo pipefail
        NUMBER=$(gh issue list --state open --search "$TITLE in:title" \
          --json number --jq 'first(.[]) | .number' 2>/dev/null) || exit 0
        [ -n "$NUMBER" ] || exit 0
        gh issue close "$NUMBER" --comment "The sync ran green again: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
