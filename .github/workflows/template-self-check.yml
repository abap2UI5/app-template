# The gates that are about THIS repository rather than about a project made
# from it. They used to be three steps inside check.yml - which is a file the
# template hands out, so every generated project inherited steps whose scripts
# stayed behind and whose first CI run died on MODULE_NOT_FOUND.
#
# The split is the rule now, not the habit: check.yml holds what a project can
# actually execute, this file holds the rest, and scripts/check-template.mjs
# fails when a handed-out file invokes one that is not handed out with it.
name: template-self-check

# The two mirror gates below are the ones that depend on ANOTHER repository:
# abap2UI5 owns docs/agents/building-apps.md (the half of AGENTS.md below
# "1. The model in one paragraph") and the four skills under .claude/skills/,
# so the drift is created by a commit over there. On a push or a pull request
# here they answer "does this change leave the mirrors intact". The question
# no commit here asks - "is the mirror still upstream's text right now" - used
# to be a daily schedule of this workflow plus an issue (for the AGENTS.md
# half only) that a maintainer answered by running the generator by hand.
# sync-mirrors.yml now answers it daily for both mirrors by running the
# generators and opening a pull request, and files the one issue for what it
# cannot carry; a schedule here would only go red beside that pull request.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# The event is part of the group so a manual run and a push do not cancel
# each other: cancel-in-progress is here to drop superseded runs of the SAME
# kind.
concurrency:
  group: template-self-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # template.json is what abap2UI5/mcp-server and the VS Code extension build
      # a project from, so a file listed there and not here (or here and not
      # there) is a project somebody else hands out with a hole in it. It also
      # gates the closure that used to be missing: every file the shared set
      # invokes has to be in the shared set.
      - name: Template description
        run: node scripts/check-template.mjs

      # Everything in AGENTS.md from "1. The model in one paragraph" down is
      # abap2UI5's app-building guide, generated into that file from the guide
      # plus the declared deviations. This fails when the two have parted - and
      # says so and passes when the guide cannot be reached at all.
      - name: App guide mirror
        run: node scripts/generate-agents.mjs --check

      # The four agent skills under .claude/skills/ are generated from the
      # framework's the same way, with their own declared deviations, and ship
      # with every project. Same contract: fails on drift, says so and passes
      # when the framework is unreachable.
      #
      # Red on a pull request that touched neither mirror means abap2UI5 moved
      # since main was last synced: the open `bot/sync-mirrors` pull request
      # (sync-mirrors.yml) carries it - merge that, or run it from the Actions
      # tab if there is none yet, and rebase.
      - name: Agent skills mirror
        run: node scripts/generate-skills.mjs --check

      # create/ (the `npm create abap2ui5-app` package) ships a byte-equal copy
      # of scripts/lib/substitute.mjs, the substitution code rename.mjs runs.
      - name: The create package's substitution copy
        run: node scripts/sync-create.mjs --check

      # The programs above parse files by regex, and a pattern that stops
      # matching turns its gate into one that passes by checking nothing.
      - name: Script unit tests
        run: node --test scripts/test/*.test.mjs
