# The two gates every abap2UI5 app repo gets for free - both run without an
# SAP system:
#
#   abaplint       - ABAP syntax and style, with the abap2UI5 framework cloned
#                    as a dependency so z2ui5_* names resolve
#   abap2ui5lint   - the abap2UI5-linter: the app class and the view it builds,
#                    checked together (controls, properties, UI5 version floor,
#                    bindings, builder-tree defects) plus a headless
#                    XMLView.create render of every view
#
# The two halves are run differently, and the reason is worth knowing before
# you copy this file:
#
#   abaplint runs from THIS repository's devDependencies (`npm ci` below), so
#   the version CI uses is the version `npm run check` uses on your machine -
#   package-lock.json decides both.
#
#   the abap2UI5-linter runs as its own GitHub Action, `abap2UI5/linter`. The
#   action brings its own install plus the ~118 MB UI5 runtime and the Chromium
#   the render gate needs, which is what makes three steps of a hand-rolled
#   workflow into one. Every input left unset falls back to this repository's
#   `abap2ui5lint.jsonc`, so paths, UI5 floor, distribution, rule severities and
#   the fail level are still decided by the config in this repo - not by the
#   workflow, and not by the action.
#
#   That does mean the linter version CI runs comes from the action pin, not
#   from package-lock.json. The pin below is the action's `v0.5.1` release,
#   which is the same 0.5.x line `package.json` depends on - keep the two
#   moving together, or a local `npm run check` and this job can eventually
#   disagree about a rule. They HAD parted: the pin sat on v0.2.1 while the
#   devDependency asked for ^0.2.2, one patch apart in the direction this
#   comment warns about. The template's own check-template gate now checks the
#   pairing rather than asking anyone to remember it.
#   (`abap2UI5/linter@v0` is the shorter, always-current form; this repo pins,
#   see below.)
#
# The actions below are pinned to a COMMIT rather than to `@v7`/`@v0`, and the
# repository you make from this template inherits that. A major tag is a
# pointer its owner can move, so a job runs whatever it points at that day;
# a commit cannot change under you. The tag stays in the comment so the
# version is still readable, and `.github/dependabot.yml` (also inherited)
# moves the pins - a pinned action does not become a stale one. (Pinning
# `abap2UI5/linter` pins what that action DOES; the `actions/setup-node` it
# uses internally is still the action's own choice.)
name: check

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      # No dependencies, so it runs before the install: the framework release
      # this repository pins and the releases its prose names have to be one
      # number. This step, and every script it names, is part of what a project
      # made from this template receives - see scripts/check-template.mjs, which
      # fails when a handed-out file invokes one that stays behind.
      #
      # It also reports a newer framework release when it can reach GitHub - as
      # a notice, never as a failure. See scripts/check-pin.mjs.
      - name: Framework pin
        run: npm run check:pin

      # id, because the job-summary step below runs `npx abap2ui5lint` from
      # the devDependency this installs. Gated on this outcome rather than on
      # `always()`: without the install npx falls through to the registry,
      # where the package does not exist, and the run's last words are
      # `404 'abap2ui5lint@*' is not in this registry` - which names neither
      # the real failure nor this step.
      - id: install
        run: npm ci

      - name: abaplint (expect 0 issues)
        run: npx abaplint abaplint.jsonc

      # Settings come from abap2ui5lint.jsonc, which asks for the render gate
      # ("render": true) - so a runtime that failed to install fails this step
      # instead of being skipped with a warning under a green check. Findings
      # are annotated onto the pull request diff automatically.
      #
      # Useful inputs this deliberately does NOT set: `paths`, `min-ui5`,
      # `fail-on` (all read from abap2ui5lint.jsonc), `render: false` (a much
      # faster property-only job, no UI5 runtime, no browser), `screenshots:
      # build/screenshots` (photographs every checked view, for an
      # upload-artifact step to publish - it runs even when the check failed).
      - name: abap2UI5-linter (property gate + headless render)
        uses: abap2UI5/linter@8ae804f2db216f6cff629194ebd46db3af01fa9c # v0.5.1

      # The same report as markdown on the run's own page - property gate only,
      # since the step above already decided whether the views load. This one
      # runs from the repo's own devDependency: the action reports into the log
      # and onto the diff, and has no input that writes a job summary.
      - name: Job summary
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx abap2ui5lint --no-render --advisory --no-progress --format markdown >> "$GITHUB_STEP_SUMMARY"
