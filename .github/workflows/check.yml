# The two gates every abap2UI5 app repo gets for free - both run without an
# SAP system, and both are the same versions `npm run check` runs locally,
# because they are devDependencies resolved through package-lock.json:
#
#   abaplint       - ABAP syntax and style, with the abap2UI5 framework cloned
#                    as a dependency so z2ui5_* names resolve
#   abap2ui5lint   - the abap2UI5-linter: the app class and the view it builds,
#                    checked together (controls, properties, UI5 version floor,
#                    bindings, builder-tree defects) plus a headless
#                    XMLView.create render of every view
#
# The linter also ships as a GitHub Action (`uses: abap2UI5/linter@v0` - the
# major tag, every input optional and defaulting to abap2ui5lint.jsonc). It is
# the shorter workflow; the npm route below is used here because it pins one
# version for CI and for `npm run check` on your machine.
#
# The two actions below are pinned to a COMMIT rather than to `@v7`, and the
# repository you make from this template inherits that. A major tag is a
# pointer its owner can move, so a job runs whatever it points at that day;
# a commit cannot change under you. The tag stays in the comment so the
# version is still readable, and `.github/dependabot.yml` (also inherited)
# moves the pins - a pinned action does not become a stale one.
name: check

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: abaplint (expect 0 issues)
        run: npx abaplint abaplint.jsonc

      # the render gate drives a headless browser; @abap2ui5/render-runtime
      # (a devDependency) brings the UI5 sources it serves
      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      # settings come from abap2ui5lint.jsonc, which asks for the render gate
      # ("render": true) - so a runtime that failed to install fails this step
      # instead of being skipped with a warning under a green check. Findings
      # are annotated onto the pull request diff automatically inside a
      # workflow.
      - name: abap2UI5-linter (property gate + headless render)
        run: npx abap2ui5lint

      # the same report as markdown on the run's own page - property gate only,
      # since the step above already decided whether the views load
      - name: Job summary
        if: always()
        run: npx abap2ui5lint --no-render --advisory --no-progress --format markdown >> "$GITHUB_STEP_SUMMARY"
